<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albert Heijn</title>
    <style>
      :root {
        color-scheme: light;
        --ah-red: #d40034;
        --ah-black: #1a1a1a;
        --ah-gray: #f3f4f5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: var(--ah-black);
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(90vw, 600px);
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin-bottom: 1.5rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        background: var(--ah-gray);
        color: var(--ah-black);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { background: #e9ebed; }
      ul {
        list-style: none;
        padding: 0;
        margin: 1.5rem 0 0;
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      .brand {
        color: var(--ah-red);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="brand">Albert Heijn</span></h1>
      <nav aria-label="Hoofdnavigatie">
        <a href="https://www.ah.nl/">Home</a>
        <a href="https://www.ah.nl/producten">Producten</a>
        <a href="https://www.ah.nl/bonus">Bonus</a>
        <a href="https://www.ah.nl/over-ons">Over ons</a>
      </nav>
      <ul>
        <li><a href="https://www.facebook.com/AlbertHeijn" target="_blank" rel="noreferrer noopener">Facebook</a></li>
        <li><a href="https://www.instagram.com/albertheijn/" target="_blank" rel="noreferrer noopener">Instagram</a></li>
      </ul>
    </main>
  </body>
</html>
