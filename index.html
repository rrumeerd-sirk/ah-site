<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AH Phone Mockup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="promo-card">
        <span class="promo-line">NIEUW</span>
        <span class="promo-line large">Video banners</span>
      </div>

      <div class="device-wrap">
        <div class="device">
          <div class="notch"></div>
          <div class="screen">
            <div class="statusbar">
              <span>9:41</span>
              <div class="icons">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="signal"></span>
              </div>
            </div>

            <div class="toolbar">
              <span class="left-icon">◌</span>
              <div class="search-pill">
                <span class="search-mark">⌕</span>
                <span>Zoek naar producten</span>
              </div>
              <span class="right-icon">⚙</span>
            </div>

            <div class="app-card">
              <div class="top-strip">
                <span>AH</span>
                <span>◦◦◦</span>
              </div>

              <div class="headline">
                Gemakkelijk een heerlijke<br />
                maaltijd op tafel
              </div>

              <div class="food-scene">
                <div class="food food-a"></div>
                <div class="food food-b"></div>
                <div class="food food-c"></div>
              </div>

              <div class="cards-row">
                <div class="mini-card">
                  <div class="mini-illustration one"></div>
                  <div class="mini-label">Bons</div>
                </div>
                <div class="mini-card">
                  <div class="mini-illustration two"></div>
                  <div class="mini-label">Bakkerij</div>
                </div>
                <div class="mini-card">
                  <div class="mini-illustration three"></div>
                  <div class="mini-label">Fruit</div>
                </div>
              </div>

              <div class="bottom-cta">
                <div class="cta-copy">
                  <strong>Mijn Albert Heijn</strong>
                  <small>Wijzig je bestellingen</small>
                </div>
                <div class="cta-arrow">→</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
